{% set name = "djangorestframework-gis" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/djangorestframework_gis-{{ version }}.tar.gz
  sha256: f9ab54cf2f737f798fccd1f3b0501377f1053699ca421154cc3fb3edc4856366

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - django >=4.2
    - python >={{ python_min }}
    - djangorestframework >=3.12,<3.19
    - django-filter >=23.5,<27.0

test:
  imports:
    - rest_framework_gis
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/djangonauts/django-rest-framework-gis
  summary: Geographic add-ons for Django Rest Framework
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/djangonauts/django-rest-framework-gis
  dev_url: https://github.com/djangonauts/django-rest-framework-gis

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
