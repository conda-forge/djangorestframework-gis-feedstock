schema_version: 1

context:
  version: "1.3.0"

package:
  name: djangorestframework-gis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework-gis/djangorestframework_gis-${{ version }}.tar.gz
  sha256: f9ab54cf2f737f798fccd1f3b0501377f1053699ca421154cc3fb3edc4856366

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - djangorestframework >=3.12,<3.19
    - django-filter >=23.5,<27.0

tests:
  - python:
      imports:
        - rest_framework_gis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Geographic add-ons for Django Rest Framework
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/openwisp/django-rest-framework-gis

extra:
  recipe-maintainers:
    - ocefpaf
